name: Something doesn't work
description: Report a bug or an error message.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Before you start, have a look at [Troubleshooting](https://github.com/Self-hosted-MCP/Coolify-Cloudflare-MCP/blob/main/docs/troubleshooting.md): many problems have a quick fix there.

        **Security problem?** Don't post it here. Use [private reporting](https://github.com/Self-hosted-MCP/Coolify-Cloudflare-MCP/security/advisories/new) instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: This page is public. Anyone can read it.
      options:
        - label: I removed passwords, keys, tokens and private data from everything below.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the exact message, if there was one. Logs from your hosting company or terminal help too.
      render: text
  - type: dropdown
    id: how
    attributes:
      label: How do you run it?
      options:
        - Claude Desktop extension
        - On my computer (stdio)
        - On my computer, web mode (serve)
        - Railway
        - Render
        - My own server with Docker
        - Something else
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which AI app?
      multiple: true
      options:
        - Claude (website or phone)
        - Claude Desktop
        - Claude Code
        - Codex
        - ChatGPT
        - Cursor
        - VS Code
        - Gemini CLI
        - Something else
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04 ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `coolify-cloudflare-mcp version`. Otherwise the date you installed or last updated.
      placeholder: 0.1.0
