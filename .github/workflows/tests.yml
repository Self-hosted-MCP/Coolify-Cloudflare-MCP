# Runs every test on each push and pull request, on the oldest and newest supported Python.
# The tests use test data only: no real account, password or network service is touched.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.0, pinned
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      # Unsafe patterns in GitHub Actions: leaked tokens, injection, broad permissions.
      - run: pipx run zizmor==1.31.1 --offline .
