# Code scanning with GitHub's CodeQL: looks for common vulnerabilities in the code on every push, pull request and weekly.
# Free on public repositories. On a private repository it fails with "Code scanning is not enabled" unless the account has
# GitHub Code Security (paid). Results show in the Security tab, under Code scanning.
# Languages: python, javascript-typescript, go, java-kotlin, csharp, cpp, ruby, swift, actions. Change python to match.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 3"   # Wednesdays, 03:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # to upload the results
      contents: read
      actions: read            # needed on private repositories, harmless on public ones
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1, pinned
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1, pinned
