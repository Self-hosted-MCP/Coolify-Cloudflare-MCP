# One small container. Two doors, both published on loopback only; a Cloudflare tunnel carries them out:
#   8765  Claude's door (/mcp, /login)  -> public hostname, Zero Trust Bypass for Anthropic's range plus the passphrase login
#   8766  the owner's Confirm page          -> its own hostname behind Zero Trust "owner only"
# Nothing here is a secret. Secrets are set in Coolify (Is Literal on) and listed in .env.example.
services:
  mcp:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8766:8766"
    restart: unless-stopped
    user: "1000:1000"
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    extra_hosts:
      - "host.docker.internal:host-gateway"   # to reach Coolify's own API on this server (see docs/deploy.md)
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      CONFIRM_URL: ${CONFIRM_URL:?set CONFIRM_URL}
      ALLOWED_REDIRECT_HOSTS: ${ALLOWED_REDIRECT_HOSTS:-claude.ai,claude.com}
      LOGIN_HASH: ${LOGIN_HASH:?set LOGIN_HASH}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ACCESS_ENFORCE: ${ACCESS_ENFORCE:-1}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?set CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set CF_ACCESS_AUD}
      CONFIRM_ALLOWED_EMAILS: ${CONFIRM_ALLOWED_EMAILS:?set CONFIRM_ALLOWED_EMAILS}
      COOLIFY_API_URL: ${COOLIFY_API_URL:?set COOLIFY_API_URL}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:?set COOLIFY_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_READ_TOKEN: ${CLOUDFLARE_READ_TOKEN:-}
      CLOUDFLARE_ZONE_NAME: ${CLOUDFLARE_ZONE_NAME:-}
      CLOUDFLARE_EDIT_TOKEN: ${CLOUDFLARE_EDIT_TOKEN:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
      PROTECTED_HOSTNAMES: ${PROTECTED_HOSTNAMES:-}
      ROUTE_BLOCKED_PORTS: ${ROUTE_BLOCKED_PORTS:-}
      ROUTE_ALLOWED_PORTS: ${ROUTE_ALLOWED_PORTS:-}
      SSH_HOST: ${SSH_HOST:-}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USER: ${SSH_USER:-}
      SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY:-}
      SSH_KNOWN_HOSTS: ${SSH_KNOWN_HOSTS:-}
      READ_ONLY: ${READ_ONLY:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  data:
